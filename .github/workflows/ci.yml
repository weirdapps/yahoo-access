name: CI
on: [push, pull_request]
# Minimal token scope. Without a permissions: key, GITHUB_TOKEN arrives with
# the repository default, which can be write across contents, issues,
# pull-requests and more. Nothing here writes anything; it checks out and runs
# checks.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      # Pinned, so a new uv release cannot change what CI installs or runs.
      - run: pip install uv==0.12.21
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check server.py tests/
      - run: uv run pytest -v
