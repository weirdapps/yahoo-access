[project]
name = "yahoo-access"
version = "0.1.0"
description = "MCP server for Yahoo Mail (IMAP/SMTP), multi-account, draft-first"
requires-python = ">=3.12"
dependencies = ["mcp[cli]>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16.2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
