# SonarCloud configuration

sonar.organization=weirdapps
sonar.projectKey=weirdapps_yahoo-access
sonar.projectName=yahoo-access

# Source code location.
sonar.sources=server.py
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Python-specific settings
sonar.python.version=3.12

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions. coverage.xml is written by pytest-cov during the job, before the
# scanner runs, so leaving it in sources bills a regenerated, untracked file.
sonar.exclusions=\
  **/tests/**,\
  **/.venv/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/*.egg-info/**,\
  coverage.xml,\
  **/coverage.xml,\
  .github/**

# Test exclusions
sonar.test.exclusions=\
  **/tests/**,\
  **/*_test.py,\
  **/test_*.py
